<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 코딩 테스트 & 오답노트 캘린더</title>
  
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-typescript.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 20px; 
    }

    .container {
      max-width: 700px;
      margin: auto;
      background-color: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1, h2, h3 {
      text-align: center;
      color: #333;
    }

    .api-area {
      background-color: #f9f9f9;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px dashed #ccc;
    }

    .settings-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      align-items: center;
    }

    .settings-row:last-child {
      margin-bottom: 0;
    }

    .settings-row label {
      font-weight: bold; 
      width: 140px;
    }

    select, input {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background-color: white;
    }

    .quiz-area {
      background-color: #edf2f7;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .quiz-question {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 15px;
      white-space: pre-wrap;
      background-color: #1d1f21;
      color: #c5c8c6;
      padding: 15px;
      border-radius: 8px;
      line-height: 1.6;
    }

    .quiz-question pre[class*="language-"] {
      margin: 12px 0;
      padding: 14px;
      border-radius: 6px;
      font-family: 'Fira Code', 'Courier New', Courier, monospace;
      font-size: 14px;
      background: #2d2d2d !important;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .quiz-opt-btn {
      padding: 12px; 
      background-color: white;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      text-align: left;
      cursor: pointer;
      font-size: 15px;
      transition: background 0.2s, color 0.2s;
      color: #2d3748 !important; 
    }

    .quiz-opt-btn:hover {
      background-color: #4a5568; 
      color: white !important;    
    }

    .quiz-explanation {
      margin-top: 15px;
      padding: 15px;
      background-color: #fff;
      border-left: 4px solid #4a5568;
      border-radius: 4px;
      font-size: 14px;
      color: #4a5568;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .calendar-nav-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .calendar-btn-group button {
      padding: 8px 14px;
      font-size: 14px;
      background-color: #4a5568;
    }
    .calendar-btn-group button:hover {
      background-color: #2d3748;
    }

    .calendar-container {
      margin-top: 10px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      text-align: center;
    }

    .calendar-header {
      font-weight: bold;
      background-color: #e2e8f0;
      padding: 8px;
      border-radius: 4px;
    }

    .calendar-day {
      background-color: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      min-height: 65px;
      padding: 5px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      transition: background-color 0.2s;
    }

    .calendar-day.has-data {
      cursor: pointer;
    }
    .calendar-day.has-data:hover {
      background-color: #f7fafc;
    }

    .day-num {
      font-size: 12px;
      color: #718096;
      text-align: left;
    }

    .quiz-result-badge {
      font-size: 11px;
      font-weight: bold;
      border-radius: 4px;
      padding: 2px 4px;
      text-align: center;
      margin-top: 2px;
    }

    .badge-correct { background-color: #c6f6d5; color: #22543d; }
    .badge-wrong { background-color: #fed7d7; color: #742a2a; }

    button {
      padding: 12px 15px;
      font-size: 15px;
      border: none;
      border-radius: 8px;
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background-color: #45a049; }

    .result {
      margin-top: 15px;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      font-size: 16px;
      line-height: 1.5;
    }

    .modal {
      display: none; 
      position: fixed; 
      z-index: 1000; 
      left: 0; top: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background-color: white;
      padding: 25px;
      border-radius: 12px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }
    .close-btn {
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      color: #aaa;
    }
    .close-btn:hover { color: #333; }
    .modal-item {
      border-bottom: 1px dashed #cbd5e0;
      padding: 15px 0;
    }
    .modal-item:last-child { border-bottom: none; }
  </style>
</head>

<body>
  <div class="container">
    <h1>💻 AI 코딩 미션 & 오답 노트</h1>

    <div class="api-area">
      <div class="settings-row">
        <label for="apiKeyInput">Gemini API Key:</label>
        <input type="password" id="apiKeyInput" placeholder="AI 키를 입력해 주세요">
        <button onclick="saveApiKey()">저장</button>
      </div>
      <div class="settings-row">
        <label for="langSelect">프로그래밍 언어:</label>
        <select id="langSelect" onchange="saveLanguage()">
          <option value="JavaScript">JavaScript</option>
          <option value="Python">Python</option>
          <option value="Java">Java</option>
          <option value="C++">C++</option>
          <option value="TypeScript">TypeScript</option>
        </select>
      </div>
      <div class="settings-row">
        <label for="difficultySelect">문제 난이도:</label>
        <select id="difficultySelect" onchange="saveDifficulty()">
          <option value="쉬움">쉬움 (기본 문법 및 기초)</option>
          <option value="보통">보통 (실무 활용 및 알고리즘 기초)</option>
          <option value="어려움">어려움 (심화 개념 및 예외 상황)</option>
        </select>
      </div>
    </div>

    <div class="quiz-area">
      <h2>🎯 오늘의 코딩 미션</h2>
      <div id="quizContent">
        <button onclick="fetchTodayQuiz()" style="width: 100%; background-color: #3182ce;">오늘의 코딩 테스트 가져오기</button>
      </div>
    </div>

    <div class="settings-row" style="margin-bottom: 25px;">
      <button onclick="resetTodayQuiz()" style="width: 100%; background-color: #e53e3e;">🔥 오늘 테스트 기록만 초기화</button>
    </div>

    <hr style="margin: 30px 0; border: 0; border-top: 1px solid #e2e8f0;">

    <h2>📅 테스트 히스토리 & 통계</h2>
    <div class="result" id="statsResult" style="background-color: #ebf8ff; color: #2b6cb0; margin-bottom: 20px;">
      통계 데이터 로딩 중...
    </div>

    <div class="calendar-nav-wrapper">
      <h3 id="calendarMonth" style="margin: 0; min-width: 150px; text-align: left;">2026년 5월</h3>
      <div class="calendar-btn-group">
        <button onclick="moveMonth(-1)">◀ 이전 달</button>
        <button onclick="moveMonth(0)" style="background-color: #3182ce;">오늘</button>
        <button onclick="moveMonth(1)">다음 달 ▶</button>
      </div>
    </div>

    <div class="calendar-container">
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>
  </div>

  <div id="noteModal" class="modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="modalTitle" style="margin:0; color:#2d3748;">오답 노트 다시보기</h3>
        <span class="close-btn" onclick="closeModal()">&times;</span>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    const languageTopics = {
      JavaScript: ["클로저(Closure)", "비동기 처리(Promise/Async-Await)", "호이스팅과 스코프 법칙", "배열 고차 함수(map/filter/reduce)", "프로토타입과 클래스 상속", "이벤트 루프와 태스크 큐", "지정 연산자 및 구조분해 할당"],
      Python: ["리스트 컴프리헨션", "데코레이터(Decorator)", "제너레이터와 이터레이터", "딕셔너리 조작 및 매핑", "args 및 kwargs 가변 인자", "메모리 참조 및 깊은/얕은 복사", "예외 처리(try-except-finally)"],
      Java: ["가비지 컬렉션 구조", "인터페이스와 추상 클래스 구현", "스트림 API 활용", "제네릭(Generics) 스펙", "멀티 스레드 및 동기화", "예외 계층 구조(Checked/Unchecked)", "오버라이딩 vs 오버로딩 에지 케이스"],
      "C++": ["포인터 및 참조자 배정 연산", "동적 할당과 스마트 포인터", "가상 함수와 다형성 구조", "STL 컨테이너 복잡도", "템플릿(Template) 메타 프로그래밍", "복사 생성자 및 이동 생성자 법칙", "메모리 누수 원인 분석"],
      TypeScript: ["인터페이스 vs 타입 앨리어스", "제네릭 제약 조건(Extends)", "유니온 타입 및 가드 기법", "유틸리티 타입(Partial/Pick/Omit)", "Enums 와 리터럴 상수 차이", "Mapped Types 생성 기법", "Strict Mode 하에서의 널 체크 프로토콜"]
    };

    let quizHistory = JSON.parse(localStorage.getItem("quizHistory")) || {};
    let geminiApiKey = localStorage.getItem("geminiApiKey") || "";
    let selectedLang = localStorage.getItem("selectedLang") || "JavaScript";
    let selectedDifficulty = localStorage.getItem("selectedDifficulty") || "보통";
    
    let currentQuizData = null;
    let forceNewQuiz = false;
    let currentCalendarDate = new Date();
    const todayDateStr = new Date().toISOString().split('T')[0];

    // 💡 [원인 해결 2] 중복 호출 및 연타 방지용 글로벌 로딩 플래그 도입
    let isQuizLoading = false; 

    document.getElementById("apiKeyInput").value = geminiApiKey;
    document.getElementById("langSelect").value = selectedLang;
    document.getElementById("difficultySelect").value = selectedDifficulty;

    // 안전하게 하이라이팅을 호출하는 헬퍼 함수
    function safeHighlightAll() {
      if (typeof Prism !== 'undefined') {
        Prism.highlightAll();
      }
    }

    function getPrismLangClass(lang) {
      const map = { "JavaScript": "javascript", "Python": "python", "Java": "java", "C++": "cpp", "TypeScript": "typescript" };
      return map[lang] || "javascript";
    }

    function resetTodayQuiz() {
      if (quizHistory[todayDateStr]) {
        delete quizHistory[todayDateStr];
        localStorage.setItem("quizHistory", JSON.stringify(quizHistory));
        alert("오늘의 기록이 리셋되었습니다.");
        location.reload(); 
      } else {
        alert("오늘 풀이한 기록이 없습니다.");
      }
    }

    function saveApiKey() {
      const key = document.getElementById("apiKeyInput").value.trim();
      if (!key) { alert("올바른 API 키를 입력해주세요."); return; }
      localStorage.setItem("geminiApiKey", key);
      geminiApiKey = key;
      alert("API 키가 저장되었습니다.");
    }

    function saveLanguage() {
      selectedLang = document.getElementById("langSelect").value;
      localStorage.setItem("selectedLang", selectedLang);
    }

    function saveDifficulty() {
      selectedDifficulty = document.getElementById("difficultySelect").value;
      localStorage.setItem("selectedDifficulty", selectedDifficulty);
    }

    async function fetchTodayQuiz() {
      if (!geminiApiKey) { alert("먼저 Gemini API 키를 등록하고 저장해주세요!"); return; }
      
      // 💡 [원인 해결 2] 이미 요청이 처리 중인 경우 추가 차단
      if (isQuizLoading) return;

      if (!forceNewQuiz && quizHistory[todayDateStr]) {
        renderQuizResultView(quizHistory[todayDateStr].success, quizHistory[todayDateStr].question, quizHistory[todayDateStr].explanation);
        return;
      }

      const quizContentDiv = document.getElementById("quizContent");
      quizContentDiv.innerHTML = `<p style='text-align:center;'>🤖 Gemini가 문제를 엄선하는 중입니다... (중복 요청 금지)</p>`;

      // 로딩 활성화
      isQuizLoading = true;

      const currentList = languageTopics[selectedLang] || languageTopics["JavaScript"];
      const chosenTopic = currentList[Math.floor(Math.random() * currentList.length)];

      const prompt = `당신은 코딩 테스트 전문 면접관입니다.
${selectedLang} 언어를 기반으로 하며 난이도가 [${selectedDifficulty}] 수준인 정밀하고 유익한 객관식 문제를 1개 출제해 주세요.
특히 이번 문제는 핵심 개념 중 하나인 **[${chosenTopic}]** 영역을 깊이 있게 다루거나 파고드는 문제여야 합니다.

[출제 요구사항]
1. 문제 내용에 등장하는 모든 소스 코드는 반드시 코드의 시작과 끝을 백틱 3개(\`\`\`)로 감싸서 응답에 포함하십시오. 예시: \`\`\`\\n코드내용\\n\`\`\`
2. 정답 인덱스(answer) 검산을 철저히 실행해 오류가 없도록 하십시오. (answer는 0, 1, 2, 3 중 하나)
3. 정확히 아래 명시된 JSON 포맷의 데이터만 출력하세요. 앞뒤에 \`\`\`json 같은 마크다운 기호는 절대 제외하고 순수 텍스트 껍데기만 출력하십시오.

{
  "question": "문제 설명과 소스 코드가 들어가는 영역입니다. 소스 코드는 반드시 백틱 3개(\`\`\`)로 감싸주세요. 줄바꿈은 \\n을 사용합니다.",
  "options": ["1번 보기", "2번 보기", "3번 보기", "4번 보기"],
  "answer": 0,
  "explanation": "정답 해설을 작성하세요. 줄바꿈은 \\n을 사용합니다."
}`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent?key=${geminiApiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        if (!response.ok) { throw new Error(`HTTP 에러: ${response.status}`); }
        const data = await response.json();
        let rawText = data.candidates[0].content.parts[0].text.trim();
        
        rawText = rawText.replace(/^```json/i, "").replace(/```$/, "").trim();
        
        const quizData = JSON.parse(rawText);
        currentQuizData = quizData; 
        renderQuiz(quizData);
      } catch (error) {
        console.error(error);
        let errorMsg = error.message;
        if (errorMsg.includes("429")) {
          errorMsg = "Gemini API의 요청 제한(RPM)을 초과했습니다. 약 1분 뒤에 다시 시도해 주세요.";
        }
        quizContentDiv.innerHTML = `
          <p style='color:red; text-align:center;'>문제를 불러오지 못했습니다.<br><small>${errorMsg}</small></p>
          <button onclick="fetchTodayQuiz()" style="width: 100%; background-color: #3182ce; margin-top: 10px;">다시 시도</button>
        `;
      } finally {
        // 통신 완료 후 로딩 해제
        isQuizLoading = false;
      }
    }

    function formatQuestionText(text) {
      if (!text) return "";
      const parts = text.split("```");
      let resultHtml = "";
      
      parts.forEach((part, index) => {
        if (index % 2 === 1) {
          let cleanCode = part.replace(/^(javascript|python|java|cpp|typescript|c)\s*/i, "");
          cleanCode = cleanCode.replace(/</g, "&lt;").replace(/>/g, "&gt;").trim();
          const langClass = getPrismLangClass(selectedLang);
          resultHtml += `<pre><code class="language-${langClass}">${cleanCode}</code></pre>`;
        } else {
          const safeText = part.replace(/</g, "&lt;").replace(/>/g, "&gt;");
          resultHtml += `<span>${safeText}</span>`;
        }
      });
      return resultHtml;
    }

    function renderQuiz(quizData) {
      const quizContentDiv = document.getElementById("quizContent");
      let optionsHtml = quizData.options.map((opt, idx) => `
        <button class="quiz-opt-btn" onclick="submitAnswer(${idx})">
          ${idx + 1}. ${opt.replace(/</g, "&lt;").replace(/>/g, "&gt;")}
        </button>
      `).join('');

      quizContentDiv.innerHTML = `
        <div class="quiz-question">${formatQuestionText(quizData.question)}</div>
        <div class="quiz-options">${optionsHtml}</div>
      `;
      
      safeHighlightAll();
    }

    function submitAnswer(chosenIdx) {
      if (!currentQuizData) return;

      const correctIdx = currentQuizData.answer;
      const questionText = currentQuizData.question;
      const explanationText = currentQuizData.explanation || "해설이 누락되었습니다.";
      const isSuccess = (chosenIdx === correctIdx);
      
      if (quizHistory[todayDateStr] && forceNewQuiz) {
        if (quizHistory[todayDateStr].totalCount === undefined) {
          const prevSuccess = quizHistory[todayDateStr].success;
          quizHistory[todayDateStr].totalCount = 1;
          quizHistory[todayDateStr].correctCount = prevSuccess ? 1 : 0;
          quizHistory[todayDateStr].details = [{ success: prevSuccess, question: quizHistory[todayDateStr].question, explanation: quizHistory[todayDateStr].explanation }];
        }
        
        quizHistory[todayDateStr].totalCount += 1;
        if (isSuccess) quizHistory[todayDateStr].correctCount += 1;
        quizHistory[todayDateStr].success = (quizHistory[todayDateStr].correctCount === quizHistory[todayDateStr].totalCount);
        quizHistory[todayDateStr].question = questionText;
        quizHistory[todayDateStr].explanation = explanationText;
        quizHistory[todayDateStr].details.push({ success: isSuccess, question: questionText, explanation: explanationText });
      } else {
        quizHistory[todayDateStr] = {
          question: questionText,
          success: isSuccess,
          explanation: explanationText,
          totalCount: 1,
          correctCount: isSuccess ? 1 : 0,
          details: [{ success: isSuccess, question: questionText, explanation: explanationText }]
        };
      }

      localStorage.setItem("quizHistory", JSON.stringify(quizHistory));
      alert(isSuccess ? "🎉 정답입니다! 훌륭해요." : `❌ 아쉽게도 틀렸습니다! (정답은 ${correctIdx + 1}번)`);

      forceNewQuiz = false;
      renderQuizResultView(isSuccess, questionText, explanationText);
      initCalendar();
      calculateStats();
    }

    function renderQuizResultView(isSuccess, questionText, explanationText) {
      const quizContentDiv = document.getElementById("quizContent");
      let daySummaryHtml = "";
      const todayData = quizHistory[todayDateStr];
      if (todayData && todayData.totalCount > 1) {
        daySummaryHtml = `<p style="font-size:14px; color:#4a5568; text-align:center;">(오늘 총 <strong>${todayData.totalCount}문제</strong> 중 <strong>${todayData.correctCount}문제</strong> 성공!)</p>`;
      }

      quizContentDiv.innerHTML = `
        <div class="quiz-question">${formatQuestionText(questionText)}</div>
        <div style="text-align: center; font-size: 18px; font-weight: bold; color: ${isSuccess ? '#2f855a' : '#c53030'}; margin-top:15px;">
          ${isSuccess ? "🟢 정답 처리되었습니다." : "🔴 오답 처리되었습니다."}
        </div>
        ${daySummaryHtml}
        <div class="quiz-explanation"><strong>💡 정밀 분석 해설:</strong><br>${explanationText.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>
        <div style="margin-top: 15px;">
          <button onclick="startMoreQuiz()" style="width: 100%; background-color: #2b6cb0;">🚀 무작위 새 문제 하나 더 풀기</button>
        </div>
      `;
      
      safeHighlightAll();
    }

    function startMoreQuiz() {
      forceNewQuiz = true;
      fetchTodayQuiz();
    }

    function moveMonth(direction) {
      if (direction === 0) currentCalendarDate = new Date();
      else currentCalendarDate.setMonth(currentCalendarDate.getMonth() + direction);
      initCalendar();
    }

    function initCalendar() {
      const grid = document.getElementById("calendarGrid");
      const monthTitle = document.getElementById("calendarMonth");
      grid.innerHTML = "";

      const year = currentCalendarDate.getFullYear();
      const month = currentCalendarDate.getMonth(); 
      monthTitle.textContent = `${year}년 ${month + 1}월`;

      const weekDays = ["일", "월", "화", "수", "목", "금", "토"];
      weekDays.forEach(day => {
        const header = document.createElement("div");
        header.className = "calendar-header";
        header.textContent = day;
        grid.appendChild(header);
      });

      const firstDayIdx = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDayIdx; i++) {
        grid.appendChild(document.createElement("div"));
      }

      for (let date = 1; date <= lastDate; date++) {
        const dayCell = document.createElement("div");
        dayCell.className = "calendar-day";

        const numDiv = document.createElement("div");
        numDiv.className = "day-num";
        numDiv.textContent = date;
        dayCell.appendChild(numDiv);

        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;
        
        if (quizHistory[dateStr]) {
          dayCell.classList.add("has-data");
          dayCell.onclick = () => openNoteModal(dateStr);

          const badge = document.createElement("div");
          const dayData = quizHistory[dateStr];
          
          if (dayData.totalCount && dayData.totalCount > 1) {
            badge.className = `quiz-result-badge`;
            badge.style.backgroundColor = "#e2e8f0";
            badge.style.color = "#2d3748";
            badge.textContent = `🎯 ${dayData.correctCount}/${dayData.totalCount}`;
          } else {
            badge.className = `quiz-result-badge ${dayData.success ? 'badge-correct' : 'badge-wrong'}`;
            badge.textContent = dayData.success ? "정답" : "오답";
          }
          dayCell.appendChild(badge);
        }
        grid.appendChild(dayCell);
      }
    }

    function openNoteModal(dateStr) {
      const modal = document.getElementById("noteModal");
      const title = document.getElementById("modalTitle");
      const body = document.getElementById("modalBody");
      
      const dayData = quizHistory[dateStr];
      if (!dayData) return;

      title.textContent = `📝 ${dateStr} 학습 복습 노트`;
      body.innerHTML = "";

      const items = dayData.details || [{ success: dayData.success, question: dayData.question, explanation: dayData.explanation }];

      items.forEach((item, index) => {
        const itemDiv = document.createElement("div");
        itemDiv.className = "modal-item";
        itemDiv.innerHTML = `
          <h4 style="margin-top:0; color:${item.success ? '#2f855a' : '#c53030'};">
            ${index + 1}번 미션: ${item.success ? "🟢 정답 패스" : "🔴 다시 보기 대상(오답)"}
          </h4>
          <div class="quiz-question">${formatQuestionText(item.question)}</div>
          <div class="quiz-explanation" style="background-color:#f7fafc; margin-top:8px; font-size:13px;">
            <strong>해설:</strong><br>${item.explanation.replace(/</g, "&lt;").replace(/>/g, "&gt;")}
          </div>
        `;
        body.appendChild(itemDiv);
      });

      modal.style.display = "flex";
      safeHighlightAll();
    }

    function closeModal() {
      document.getElementById("noteModal").style.display = "none";
    }

    function calculateStats() {
      const statsResult = document.getElementById("statsResult");
      const historyArray = Object.values(quizHistory);

      if (historyArray.length === 0) {
        statsResult.innerHTML = "아직 도전한 코딩 테스트 기록이 없습니다. 문제를 가져와 시작해 보세요!";
        return;
      }

      let totalQuestions = 0;
      let totalCorrect = 0;

      historyArray.forEach(dayData => {
        if (dayData.totalCount !== undefined) {
          totalQuestions += dayData.totalCount;
          totalCorrect += dayData.correctCount;
        } else {
          totalQuestions += 1;
          if (dayData.success) totalCorrect += 1;
        }
      });

      const accuracy = Math.round((totalCorrect / totalQuestions) * 100);
      statsResult.innerHTML = `
        현재까지 총 <strong>${totalQuestions}문제</strong> 중 <strong>${totalCorrect}문제</strong> 클리어!<br>
        🎯 통합 코딩 테스트 성공률: <strong>${accuracy}%</strong>
      `;
    }

    // 💡 초기 작동 시 오류 유발 요소 차단 제어 완료
    initCalendar();
    calculateStats();

    if (quizHistory[todayDateStr]) {
      renderQuizResultView(quizHistory[todayDateStr].success, quizHistory[todayDateStr].question, quizHistory[todayDateStr].explanation);
    }
  </script>
</body>
</html>
