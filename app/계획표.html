<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>오늘의 퀴즈 & 계획 캘린더</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 30px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background-color: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1, h2 {
      text-align: center;
      color: #333;
    }

    /* API 설정 영역 */
    .api-area {
      background-color: #f9f9f9;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px dashed #ccc;
    }

    /* 퀴즈 영역 */
    .quiz-area {
      background-color: #edf2f7;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .quiz-question {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .quiz-opt-btn {
      padding: 10px;
      background-color: white;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      text-align: left;
      cursor: pointer;
      font-size: 15px;
      transition: background 0.2s;
    }

    .quiz-opt-btn:hover {
      background-color: #e2e8f0;
    }

    /* 달력 스타일 */
    .calendar-container {
      margin-top: 30px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      text-align: center;
    }

    .calendar-header {
      font-weight: bold;
      background-color: #e2e8f0;
      padding: 8px;
      border-radius: 4px;
    }

    .calendar-day {
      background-color: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      min-height: 60px;
      padding: 5px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .day-num {
      font-size: 12px;
      color: #718096;
      text-align: left;
    }

    .quiz-result-badge {
      font-size: 12px;
      font-weight: bold;
      border-radius: 4px;
      padding: 2px 4px;
      text-align: center;
    }

    .badge-correct { background-color: #c6f6d5; color: #22543d; }
    .badge-wrong { background-color: #fed7d7; color: #742a2a; }

    /* 기존 스타일 유지 및 보완 */
    .input-area {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      padding: 12px 15px;
      font-size: 15px;
      border: none;
      border-radius: 8px;
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
    }

    button:hover { background-color: #45a049; }

    ul { list-style: none; padding: 0; }

    li {
      background-color: #f1f1f1;
      margin-bottom: 10px;
      padding: 12px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .plan-text { flex: 1; margin-left: 10px; }
    .done { text-decoration: line-through; color: gray; }
    .delete-btn { background-color: #ff5c5c; margin-left: 10px; }
    .delete-btn:hover { background-color: #e04848; }

    .result {
      margin-top: 25px;
      padding: 15px;
      background-color: #e8f5e9;
      border-radius: 10px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }

    .percent { color: #2e7d32; font-size: 24px; }
  </style>
</head>

<body>
  <div class="container">
    <h1>오늘의 계획 & AI 퀴즈</h1>

    <div class="api-area">
      <label for="apiKeyInput" style="font-weight: bold; display: block; margin-bottom: 5px;">Gemini API Key 설정:</label>
      <div style="display: flex; gap: 10px;">
        <input type="password" id="apiKeyInput" placeholder="AI 키를 입력해 주세요">
        <button onclick="saveApiKey()">저장</button>
      </div>
    </div>

    <div class="quiz-area">
      <h2>🧠 오늘의 상식 퀴즈</h2>
      <div id="quizContent">
        <button onclick="fetchTodayQuiz()" style="width: 100%; background-color: #3182ce;">오늘의 퀴즈 가져오기</button>
      </div>
    </div>

    <h2>📝 오늘의 할 일</h2>
    <div class="input-area">
      <input type="text" id="planInput" placeholder="오늘 할 계획을 입력하세요">
      <button onclick="addPlan()">추가</button>
    </div>

    <ul id="planList"></ul>

    <button onclick="calculatePercent()" style="width:100%; margin-top:15px;">
      하루 실행률 확인하기
    </button>

    <div class="result" id="result">
      아직 실행률을 확인하지 않았습니다.
    </div>

    <hr style="margin: 30px 0; border: 0; border-top: 1px solid #e2e8f0;">

    <h2>📅 퀴즈 히스토리 & 통계</h2>
    <div class="result" id="statsResult" style="background-color: #ebf8ff; color: #2b6cb0; margin-bottom: 15px;">
      통계 데이터 로딩 중...
    </div>

    <div class="calendar-container">
      <h3 id="calendarMonth" style="text-align: left; margin-bottom: 10px;">2026년 5월</h3>
      <div class="calendar-grid" id="calendarGrid">
        </div>
    </div>

  </div>

  <script>
    // --- 상태 관리 변수 ---
    let plans = JSON.parse(localStorage.getItem("plans")) || [];
    // 퀴즈 기록 구조: { "2026-05-30": { question: "...", success: true }, ... }
    let quizHistory = JSON.parse(localStorage.getItem("quizHistory")) || {};
    let geminiApiKey = localStorage.getItem("geminiApiKey") || "";

    // 화면 초기 진입 시 설정
    document.getElementById("apiKeyInput").value = geminiApiKey;

    const todayDateStr = new Date().toISOString().split('T')[0]; // YYYY-MM-DD 형식

    // --- API Key 저장 ---
    function saveApiKey() {
      const key = document.getElementById("apiKeyInput").value.trim();
      if (!key) {
        alert("올바른 API 키를 입력해주세요.");
        return;
      }
      localStorage.setItem("geminiApiKey", key);
      geminiApiKey = key;
      alert("API 키가 저장되었습니다.");
    }

    // --- Gemini API를 이용한 퀴즈 생성 및 가져오기 ---
    // --- Gemini API를 이용한 퀴즈 생성 및 가져오기 (최신 gemini-2.5-flash 모델 적용) ---
  async function fetchTodayQuiz() {
    if (!geminiApiKey) {
      alert("먼저 Gemini API 키를 등록하고 저장해주세요!");
      return;
    }

    if (quizHistory[todayDateStr]) {
      renderQuizResultView(quizHistory[todayDateStr].success, quizHistory[todayDateStr].question);
      return;
    }

    const quizContentDiv = document.getElementById("quizContent");
    quizContentDiv.innerHTML = "<p style='text-align:center;'>🤖 Gemini가 신선한 문제를 출제하고 있습니다...</p>";

    const prompt = `재미있고 유익한 4지선다형 일반 상식 퀴즈를 1개 만들어줘.
  너는 반드시 아래의 JSON 포맷으로만 답변해야 해. 다른 부연 설명이나 마크다운(줄바꿈, \`\`\`json 등)은 절대 포함하지 마.

  {
    "question": "질문 내용",
    "options": ["1번 선택지", "2번 선택지", "3번 선택지", "4번 선택지"],
    "answer": 0
  }`;

    try {
      // 💡 공식 v1 안정화 엔드포인트와 현재 정상 지원되는 최신 'gemini-2.5-flash' 모델을 매핑했습니다.
      const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent?key=${geminiApiKey}`, {
        method: "POST",
        headers: { 
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ 
          contents: [{ 
            parts: [{ text: prompt }] 
          }] 
        })
      });

      if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.error?.message || `HTTP 에러: ${response.status}`);
      }

      const data = await response.json();
      
      if (!data.candidates || !data.candidates[0].content.parts[0].text) {
        throw new Error("올바른 응답 데이터를 받지 못했습니다.");
      }

      let rawText = data.candidates[0].content.parts[0].text.trim();
      
      // 마크다운 잔재 확실하게 제거
      rawText = rawText.replace(/```json/gi, "").replace(/```/g, "").trim();
      
      const quizData = JSON.parse(rawText);
      renderQuiz(quizData);

    } catch (error) {
      console.error("Gemini API Error:", error);
      quizContentDiv.innerHTML = `
        <p style='color:red; text-align:center;'>퀴즈를 불러오지 못했습니다.<br><small style="color:#666;">원인: ${error.message}</small></p>
        <button onclick="fetchTodayQuiz()" style="width: 100%; background-color: #3182ce; margin-top: 10px;">다시 시도</button>
      `;
    }
  }

    // 퀴즈 화면 렌더링
    function renderQuiz(quizData) {
      const quizContentDiv = document.getElementById("quizContent");
      
      let optionsHtml = quizData.options.map((opt, idx) => `
        <button class="quiz-opt-btn" onclick="submitAnswer(${idx}, ${quizData.answer}, '${quizData.question.replace(/'/g, "\\'")}')">
          ${idx + 1}. ${opt}
        </button>
      `).join('');

      quizContentDiv.innerHTML = `
        <div class="quiz-question">Q. ${quizData.question}</div>
        <div class="quiz-options">${optionsHtml}</div>
      `;
    }

    // 정답 제출 처리
    function submitAnswer(chosenIdx, correctIdx, questionText) {
      const isSuccess = (chosenIdx === correctIdx);
      
      // 역사에 저장
      quizHistory[todayDateStr] = {
        question: questionText,
        success: isSuccess
      };
      localStorage.setItem("quizHistory", JSON.stringify(quizHistory));

      if (isSuccess) {
        alert("🎉 정답입니다! 달력에 기록되었습니다.");
      } else {
        alert(`❌ 틀렸습니다! (정답은 ${correctIdx + 1}번)\n달력에 기록되었습니다.`);
      }

      renderQuizResultView(isSuccess, questionText);
      initCalendar();
      calculateStats();
    }

    // 이미 푼 경우 결과 화면 보여주기
    function renderQuizResultView(isSuccess, questionText) {
      const quizContentDiv = document.getElementById("quizContent");
      quizContentDiv.innerHTML = `
        <div class="quiz-question" style="color: #4a5568;">Q. ${questionText}</div>
        <div style="text-align: center; font-size: 18px; font-weight: bold; color: ${isSuccess ? '#2f855a' : '#c53030'}">
          ${isSuccess ? "🟢 오늘 문제를 맞혔습니다!" : "🔴 오늘 문제를 틀렸습니다."}
        </div>
      `;
    }


    // --- 캘린더 & 통계 로직 ---
    function initCalendar() {
      const grid = document.getElementById("calendarGrid");
      const monthTitle = document.getElementById("calendarMonth");
      grid.innerHTML = "";

      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth(); // 0 ~ 11

      monthTitle.textContent = `${year}년 ${month + 1}월`;

      // 요일 헤더 추가
      const weekDays = ["일", "월", "화", "수", "목", "금", "토"];
      weekDays.forEach(day => {
        const header = document.createElement("div");
        header.className = "calendar-header";
        header.textContent = day;
        grid.appendChild(header);
      });

      // 이번 달 첫날과 마지막 날 계산
      const firstDayIdx = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();

      // 공백 채우기
      for (let i = 0; i < firstDayIdx; i++) {
        const emptyCell = document.createElement("div");
        grid.appendChild(emptyCell);
      }

      // 날짜 채우기
      for (let date = 1; date <= lastDate; date++) {
        const dayCell = document.createElement("div");
        dayCell.className = "calendar-day";

        const numDiv = document.createElement("div");
        numDiv.className = "day-num";
        numDiv.textContent = date;
        dayCell.appendChild(numDiv);

        // 해당 날짜 문자열 매칭 (YYYY-MM-DD 기법 보정)
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;
        
        // 풀었던 기록이 있다면 배지 추가
        if (quizHistory[dateStr]) {
          const badge = document.createElement("div");
          badge.className = `quiz-result-badge ${quizHistory[dateStr].success ? 'badge-correct' : 'badge-wrong'}`;
          badge.textContent = quizHistory[dateStr].success ? "정답" : "오답";
          dayCell.appendChild(badge);
        }

        grid.appendChild(dayCell);
      }
    }

    function calculateStats() {
      const statsResult = document.getElementById("statsResult");
      const historyArray = Object.values(quizHistory);

      if (historyArray.length === 0) {
        statsResult.innerHTML = "아직 도전한 퀴즈 기록이 없습니다. 첫 문제를 풀어보세요!";
        return;
      }

      const total = historyArray.length;
      const correctCount = historyArray.filter(h => h.success).length;
      const accuracy = Math.round((correctCount / total) * 100);

      statsResult.innerHTML = `
        현재까지 총 <strong>${total}회</strong> 도전 중 <strong>${correctCount}회</strong> 성공!<br>
        🎯 누적 퀴즈 정답률: <strong>${accuracy}%</strong>
      `;
    }


    // --- 기존 계획관리 로직 (유지) ---
    function savePlans() {
      localStorage.setItem("plans", JSON.stringify(plans));
    }

    function addPlan() {
      const input = document.getElementById("planInput");
      const planText = input.value.trim();

      if (planText === "") {
        alert("계획을 입력해주세요.");
        return;
      }

      plans.push({ text: planText, done: false });
      savePlans();
      input.value = "";
      showPlans();
      calculatePercent();
    }

    document.getElementById("planInput").addEventListener("keydown", function(event) {
      if (event.key === "Enter") { addPlan(); }
    });

    function showPlans() {
      const planList = document.getElementById("planList");
      planList.innerHTML = "";

      plans.forEach((plan, index) => {
        const li = document.createElement("li");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = plan.done;
        checkbox.onchange = function() {
          plans[index].done = checkbox.checked;
          savePlans();
          showPlans();
          calculatePercent();
        };

        const span = document.createElement("span");
        span.textContent = plan.text;
        span.className = "plan-text";

        if (plan.done) {
          span.classList.add("done");
          span.textContent = "✔ " + plan.text;
        }

        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "삭제";
        deleteBtn.className = "delete-btn";
        deleteBtn.onclick = function() {
          plans.splice(index, 1);
          savePlans();
          showPlans();
          calculatePercent();
        };

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(deleteBtn);
        planList.appendChild(li);
      });
    }

    function calculatePercent() {
      const result = document.getElementById("result");
      if (plans.length === 0) {
        result.innerHTML = "계획이 없습니다.";
        return;
      }

      let doneCount = 0;
      plans.forEach(plan => { if (plan.done) doneCount++; });
      const percent = Math.round((doneCount / plans.length) * 100);

      result.innerHTML = `
        오늘 계획 ${plans.length}개 중 ${doneCount}개를 완료했습니다.<br>
        실행률: <span class="percent">${percent}%</span>
      `;
    }

    // --- 초기화 구동 ---
    showPlans();
    calculatePercent();
    initCalendar();
    calculateStats();

    // 혹시 오늘 이미 문제를 풀었다면 자동으로 풀이 상태 렌더링
    if (quizHistory[todayDateStr]) {
      renderQuizResultView(quizHistory[todayDateStr].success, quizHistory[todayDateStr].question);
    }
  </script>
</body>
</html>
