<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 코딩 테스트 & 오답노트 캘린더</title>
  
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
  
  <link rel="stylesheet" href="style.css">

  <!-- PWA 설정 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3182ce">
</head>
<body>

  <div class="container">
    <h1>💻 AI 코딩 미션 & 오답 노트</h1>

    <div class="api-area">
      <div class="settings-row">
        <label for="apiKeyInput">Gemini API Key:</label>
        <input type="password" id="apiKeyInput" placeholder="AI 키를 입력해 주세요">
        <button onclick="saveApiKey()">저장</button>
      </div>
      <div class="settings-row">
        <label for="langSelect">프로그래밍 언어:</label>
        <select id="langSelect" onchange="saveLanguage()">
          <option value="JavaScript">JavaScript</option>
          <option value="Python">Python</option>
          <option value="Java">Java</option>
          <option value="C++">C++</option>
          <option value="TypeScript">TypeScript</option>
        </select>
      </div>
      <div class="settings-row">
        <label for="difficultySelect">문제 난이도:</label>
        <select id="difficultySelect" onchange="saveDifficulty()">
          <option value="쉬움">쉬움 (기본 문법 및 기초)</option>
          <option value="보통">보통 (실무 활용 및 알고리즘 기초)</option>
          <option value="어려움">어려움 (심화 개념 및 예외 상황)</option>
        </select>
      </div>
    </div>

    <div class="quiz-area">
      <h2>🎯 오늘의 코딩 미션</h2>
      <div id="quizContent">
        <button onclick="fetchTodayQuiz()" style="width: 100%; background-color: #3182ce;">오늘의 코딩 테스트 가져오기</button>
      </div>
    </div>

    <div class="settings-row" style="margin-bottom: 25px;">
      <button onclick="resetTodayQuiz()" style="width: 100%; background-color: #e53e3e;">🔥 오늘 테스트 기록만 초기화</button>
    </div>

    <hr style="margin: 30px 0; border: 0; border-top: 1px solid #e2e8f0;">

    <h2>📅 테스트 히스토리 & 통계</h2>
    <div class="result" id="statsResult" style="background-color: #ebf8ff; color: #2b6cb0; margin-bottom: 20px;">
      통계 데이터 로딩 중...
    </div>

    <div class="calendar-nav-wrapper">
      <h3 id="calendarMonth" style="margin: 0;">2026년 5월</h3>
      <div class="calendar-btn-group">
        <div class="calendar-btn-row">
          <button onclick="openSavedQuizzesModal()" style="background-color: #319795;">📂 보관함(⭐)</button>
          <button onclick="openWrongAnswersOnlyModal()" style="background-color: #dd6b20;">🚨 오답노트</button>
        </div>
        <div class="calendar-btn-row">
          <button onclick="moveMonth(-1)">◀</button>
          <button onclick="moveMonth(0)" style="background-color: #3182ce;">오늘</button>
          <button onclick="moveMonth(1)">▶</button>
        </div>
      </div>
    </div>

    <div class="filter-wrapper">
      <div class="filter-item">
        <label>언어 필터:</label>
        <select id="filterLang" onchange="initCalendar()">
          <option value="전체">전체 언어</option>
          <option value="JavaScript">JavaScript</option>
          <option value="Python">Python</option>
          <option value="Java">Java</option>
          <option value="C++">C++</option>
          <option value="TypeScript">TypeScript</option>
        </select>
      </div>
      <div class="filter-item">
        <label>난이도 필터:</label>
        <select id="filterDiff" onchange="initCalendar()">
          <option value="전체">전체 난이도</option>
          <option value="쉬움">쉬움</option>
          <option value="보통">보통</option>
          <option value="어려움">어려움</option>
        </select>
      </div>
    </div>

    <div class="calendar-container">
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>
  </div>

  <div id="noteModal" class="modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="modalTitle" style="margin:0; color:#2d3748;">오답 노트 다시보기</h3>
        <span class="close-btn" onclick="closeModal()">&times;</span>
      </div>
      <div id="modalBody"></div>
      
      <div class="modal-notes-area" id="modalNotesWrapper">
        <h4 style="margin: 0 0 8px 0; color:#4a5568;">📝 한 줄 메모 및 복습 기록</h4>
        <textarea id="modalCustomNotes" placeholder="이 문제와 관련된 개념 정리나 기억해야 할 점을 자유롭게 기록해 보세요..."></textarea>
        <button id="saveNotesBtn" style="width: 100%; margin-top: 8px; background-color: #4a5568; padding: 10px;">메모 저장하기</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-typescript.min.js"></script>

  <script src="script.js"></script>
</body>
</html>
